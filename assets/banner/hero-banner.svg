<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sri Shankar N — Digital Architect and Space Innovation</title>
  <desc id="desc">A dark cosmic banner with architectural geometry, aurora gradients, and orbital elements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10172B"/>
      <stop offset=".55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7657E8" stop-opacity=".9"/>
      <stop offset=".48" stop-color="#00D4FF" stop-opacity=".72"/>
      <stop offset="1" stop-color="#42E6B5" stop-opacity=".68"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <g opacity=".18" fill="#F8FAFC">
    <circle cx="82" cy="72" r="1.4"/><circle cx="167" cy="38" r="1"/><circle cx="244" cy="118" r="1.2"/>
    <circle cx="338" cy="44" r="1"/><circle cx="472" cy="86" r="1.3"/><circle cx="631" cy="45" r="1"/>
    <circle cx="746" cy="124" r="1.4"/><circle cx="894" cy="62" r="1"/><circle cx="1031" cy="135" r="1.2"/>
    <circle cx="1122" cy="58" r="1.4"/><circle cx="1078" cy="255" r="1"/><circle cx="915" cy="300" r="1.2"/>
  </g>
  <path d="M700 -30 C820 90 880 210 1140 390" fill="none" stroke="url(#aurora)" stroke-width="80" opacity=".10" filter="url(#glow)"/>
  <g fill="none" stroke="#94A3B8" stroke-opacity=".24">
    <ellipse cx="960" cy="190" rx="190" ry="58" transform="rotate(-18 960 190)"/>
    <ellipse cx="960" cy="190" rx="125" ry="38" transform="rotate(-18 960 190)"/>
  </g>
  <circle cx="1110" cy="118" r="29" fill="#172554" stroke="#00D4FF" stroke-width="2" stroke-opacity=".72"/>
  <path d="M1084 118h52M1110 92v52" stroke="#00D4FF" stroke-opacity=".20"/>
  <circle cx="820" cy="254" r="7" fill="#42E6B5"/>
  <g transform="translate(55 68)">
    <text fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="15" letter-spacing="5">DIGITAL ARCHITECT × SPACE INNOVATION</text>
    <text x="0" y="72" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="2">SRI SHANKAR N</text>
    <text x="0" y="112" fill="#00D4FF" font-family="JetBrains Mono, monospace" font-size="20">Building intelligent systems.</text>
    <text x="0" y="140" fill="#42E6B5" font-family="JetBrains Mono, monospace" font-size="20">Exploring beyond boundaries.</text>
  </g>
  <g transform="translate(55 270)" fill="none" stroke="#7657E8" stroke-width="1.5" opacity=".65">
    <path d="M0 24h470"/>
    <path d="M470 24l28-28 28 28 28-28 28 28" stroke="#00D4FF"/>
